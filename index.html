<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TodoList-moon</title>
    <link rel="stylesheet" href="./css/main.css">
</head>
<body>
    <div class="clock sm:max-w-[500px] max-w-[350px] h-[180px] mx-auto relative sm:mt-[20px] mt-[5px] sm:before:w-[80px] before:w-[70px] sm:before:h-[80px] before:h-[70px] before:bg-[#BFC6D7] before:rounded-[5px] before:absolute sm:before:left-[15px] before:left-[10px] sm:before:top-0 before:top-4 before:z-10 sm:after:w-[90px] sm:after:h-[90px] after:w-[85px] after:h-[85px] after:bg-[#184562] after:rounded-full after:absolute sm:after:right-[15px] after:right-[10px] sm:after:bottom-[-2px] after:bottom-2 after:z-10 ">
        <div class="sm:max-w-[400px] max-w-[280px] sm:max-h-[130px] max-h-[100px] m-auto absolute inset-0 ">
            <div class="w-full h-full pr-2 flex items-center justify-center pb-3 bg-[#C0CDE4]/45 rounded-xl backdrop-blur-[40px] shadow-[0_0_20px_rgba(0,0,0,0.5)] border-white/18 relative z-20">
                <span id="hrs" class="sm:w-[50px] w-[42px] sm:text-[67px] text-[52px] text-shadow inline-block text-center relative after:content-['HOURS'] sm:after:text-[15px] after:text-[13px] after:text-shadow-none after:text-[#2D455B] after:absolute after:-bottom-[9px] sm:after:left-[77%] after:left-[70%] after:-translate-x-1/2">00</span>
                <span class="sm:w-[50px] w-[42px] pl-5 sm:pl-2 sm:text-[67px] text-[52px] mb-2 sm:ml-3 ml-0 inline-block text-slate-700 text-center relative">:</span>    
                <span id="min" class="sm:w-[50px] w-[42px] sm:text-[67px] text-[52px] text-shadow inline-block text-center relative after:content-['MIN'] sm:after:text-[15px] after:text-[13px] after:text-shadow-none after:text-[#2D455B] after:absolute after:-bottom-[9px] sm:after:left-[77%] after:left-[70%] after:-translate-x-1/2">00</span>    
                <span class="sm:w-[50px] w-[42px] pl-5 sm:pl-2 sm:text-[67px] text-[52px] mb-2 sm:ml-3 ml-0 inline-block text-slate-700 text-center relative">:</span>   
                <span id="sec" class="sm:w-[50px] w-[42px] sm:text-[67px] text-[52px] text-shadow inline-block text-center relative after:content-['SEC'] sm:after:text-[15px] after:text-[13px] after:text-shadow-none after:text-[#2D455B] after:absolute after:-bottom-[9px] sm:after:left-[77%] after:left-[70%] after:-translate-x-1/2">00</span>
            </div>
        </div>
    </div>
    
    <div class="todo-app  max-w-[700px] mx-auto sm:mt-7 mt-4 backdrop-blur-lg am:py-5 py-3 rounded-[20px] shadow-[0_0_100px_rgba(0,0,0,0.5)] border-3 border-white/18">
        <div class="sm:mx-10 mx-5 sm:mb-9 mb-4 sm:flex sm:items-center sm:gap-3 sm:justify-between">
            <div class="sm:w-[300px] w-full mx-auto font-family sm:mb-0 mb-5">
                <span class="block text-[#112240] text-[22px] min-[371px]:text-[28px] sm:text-[19px] text-bold sm:text-start text-center">Task Management</span>
                <h1 class=" font-bold text-[55px] min-[371px]:text-[65px] sm:text-[50px] sm:text-start text-center text-[#F8FAFC] sm:leading-[58px] max-[550px]:leading-[45px] max-[370px]:leading-[45px] mb-5">Mo<em>men</em>tum</h1>
                <p class="today-date text-[#2b637c]  sm:text-start text-center font-Mono sm:leading-[15px] leading-[12px] sm:text-[20px] text-[18px] font-bold">Date: <span></span> </p>
            </div>
            
            <div class="state-container sm:w-[400px] w-full mx-auto px-[15px] py-[15px] rounded-xl border-2 border-slate-500 shadow-[0_2px_5px_rgba(0,0,0,0.5)] flex items-center justify-between gap-[20px]">
                <div class="details w-full flex flex-col gap-3">
                    <h3 class="text-[#F8FAFC] text-bold sm:text-[23px] text-[20px] font-family">You got this!</h3>
                    <div class="progressbar w-full h-[7px] bg-[#3c6675] rounded-[20px] relative">
                        <div class="progress w-[0%] h-full bg-red-500 rounded-[20px] duration-400" style="background:linear-gradient(90deg, #5490a5,#c4d8e8); box-shadow: 0 0 12px rgba(74,155,184,0.5);"></div>
                    </div>
                </div>
                <div class="state-number">
                    <p class="numbers w-[80px] h-[80px] flex items-center justify-center rounded-full text-[22px] font-bold  text-[#F8FAFC] border-2 border-slate-600 shadow-[0_2px_5px_rgba(0,0,0,0.5)]">0 / 0</p>
                </div>
            </div>
        </div>
        
        <form class="todo-form sm:max-w-[600px] w-full sm:px-0 px-3  mx-auto  sm:flex sm:items-center sm:gap-2 sm:justify-between">
            <input class="todo-input w-full sm:mb-0 mb-2 sm:p-2 p-2 sm:pl-3 pl-2 bg-gray-200 font-family text-[21px] rounded-xl outline-none focus:shadow-md focus:shadow-cyan-800 duration-400 shadow-[0_2px_5px_rgba(0,0,0,0.5)]" type="text" name="inputValue" placeholder="Add new task..." required aria-label="add new task" autocomplete="off">
            <div class="flex items-center justify-between sm:w-[55%] w-full gap-2">
                <input class="todo-due flex-1 min-w-0 text-[21px] sm:p-2 p-2 sm:pl-3 pl-2 bg-gray-200 font-family rounded-xl outline-none focus:shadow-md focus:shadow-cyan-800 duration-400 shadow-[0_2px_5px_rgba(0,0,0,0.5)]" type="text" placeholder="Due date (optional)" name="inputDue" autocomplete="off">
                <button class="flex-shrink-0 sm:w-[100px] w-[75px] sm:py-[8px] py-2 bg-[#12688D] rounded-xl shadow-[0_2px_5px_rgba(0,0,0,0.5)] duration-400 cursor-pointer" type="submit">
                    <span class=" text-white">
                        <img class="mx-auto" src="./images/save-icon.svg" alt="save-icon" width="33" height="33">
                    </span>
                </button>
            </div>
        </form>
        
        <div class="max-w-[600px] sm:mx-auto mx-3 mt-5 flex sm:flex-nowrap flex-wrap items-center sm:gap-3 gap-2 sm:justify-between font-family">
            <div onclick="handleAllListBox()" class="all-list sm:w-[33%] w-[calc(50%-4px)] sm:p-1.5 p-1 rounded-xl text-center text-[18px] border-2 shadow-[0_1px_10px_rgba(0,0,0,0.5)] border-slate-400 bg-white cursor-pointer sm:hover:scale-110 hover:scale-105 duration-400">All List: <span class="text-[26px] leading-[22px]">0</span></div>
            <div onclick="handleProgressListBox()"  class="progress-list sm:w-[33%] w-[calc(50%-4px)] sm:p-1.5 p-1 rounded-xl text-center text-[18px] border-2 shadow-[0_1px_10px_rgba(0,0,0,0.5)] border-slate-400 bg-white cursor-pointer sm:hover:scale-110 hover:scale-105 duration-400">On Progress: <span class="text-[26px] leading-[22px]">0</span></div>
            <div onclick="handleDoneListBox()"  class="done-list sm:w-[33%] w-full sm:p-1.5 p-1 rounded-xl text-center text-[18px] border-2 shadow-[0_1px_10px_rgba(0,0,0,0.5)] border-slate-400 bg-white cursor-pointer sm:hover:scale-110 hover:scale-105 duration-400">Todo Done: <span class="text-[26px] leading-[22px]">0</span></div>
        </div>
        
        <ul class="todo-list max-h-[345px] overflow-y-auto max-w-[600px] sm:mx-auto mx-2 mt-5 py-3 rounded-xl backdrop-blur-lg space-y-3"></ul>
    </div>
    
    
    <div id="wrapper" class="modal-wrapper fixed inset-0 backdrop-blur z-50 scale-0 duration-400 flex items-center justify-center p-4">
        <div class="modal-inner w-full max-w-[500px] h-auto bg-neutral-300 rounded-xl backdrop-blur-[40px] shadow-[0_0_20px_rgba(0,0,0,0.5)] border-3 border-white/18">
            <h2 class="uppercase mb-[13px] sm:mb-[20px] mt-[10px] font-semibold font-family text-[26px] text-center">Update Note</h2>
            <div class="modal-content"></div>
        </div>
    </div>
    <p class="font-bold font-family text-[50px] max-[370px]:text-[25px] max-[450px]:text-[30px] text-slate-500 text-center mt-9">Mo<em>men</em>tum — keep building</p>
    
    
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
    <script src="./js/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@hiseb/confetti@2.1.0/dist/confetti.min.js"></script>
    
</body>
</html>
